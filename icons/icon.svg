<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0b0f1a"/>
    </linearGradient>
    <linearGradient id="mic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Mic capsule -->
  <rect x="186" y="80" width="140" height="220" rx="70" fill="url(#mic)"/>

  <!-- Mic stand arc -->
  <path d="M148 280 Q148 390 256 390 Q364 390 364 280"
        fill="none" stroke="url(#mic)" stroke-width="28" stroke-linecap="round"/>

  <!-- Stem -->
  <line x1="256" y1="390" x2="256" y2="440"
        stroke="url(#mic)" stroke-width="28" stroke-linecap="round"/>

  <!-- Base -->
  <line x1="196" y1="440" x2="316" y2="440"
        stroke="url(#mic)" stroke-width="28" stroke-linecap="round"/>
</svg>
